buildscript {
	dependencies {
		classpath 'net.fabricmc:fabric-loader:0.19.5'
	}
}

plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'fabric-loom' version '1.17-SNAPSHOT'
	id 'ploceus' version '1.17-SNAPSHOT'
}

import net.fabricmc.loader.api.SemanticVersion
import net.fabricmc.loader.impl.game.minecraft.McVersionLookup

base {
	archivesName = "${project.mod_id_long}"
}
version = "${project.mod_version}"
group = "${project.mod_maven_group}"

ploceus {
	setIntermediaryGeneration(2)
}

repositories {
	maven {
		name = 'Quilt'
		url = 'https://maven.quiltmc.org/repository/release'
	}
}

dependencies {
	// dummy mc dependency to keep loom happy
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	mappings ploceus.featherMappings(project.feather_build)
}

tasks.register('generateModJson', net.fabricmc.loom.task.FabricModJsonV1Task) {
	fillModJson(project, it)

	json {
		modId = "${project.mod_id_short}" // use short id for backwards compat
		name = "${project.mod_name_long}"
		description = "${project.mod_description}"

		icon "assets/${project.mod_id_long}/icon.png"

		environment = "*"
		depends "minecraft", "*"
	}
}

tasks.withType(GenerateModuleMetadata) {
	enabled = false
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 8
}

java {
	// Still required by IDEs such as Eclipse and Visual Studio Code
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	from(file('LICENSE')) {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId project.mod_artifact_id

			pom.withXml {
				asNode().appendNode('dependencies')
			}
		}
	}
	repositories {
		def ENV = System.getenv()

		if (ENV.MAVEN_URL) {
			maven {
				url ENV.MAVEN_URL

				credentials {
					username ENV.MAVEN_USERNAME
					password ENV.MAVEN_PASSWORD
				}
			}
		} else {
			mavenLocal()
		}
	}
}

def addPomDependency(project) {
	project.rootProject.publishing {
		publications {
			mavenJava(MavenPublication) {
				pom.withXml {
					def depsNode = asNode().get("dependencies")[0]
					def depNode = depsNode.appendNode("dependency")

					depNode.appendNode("groupId", project.rootProject.library_maven_group)
					depNode.appendNode("artifactId", project.library_id)
					depNode.appendNode("version", project.library_version)
					depNode.appendNode("scope", "compile")
				}
			}
		}
	}
}

def setUpJavadoc(project) {
	project.javadoc {
		options {
			source = "8"
			encoding = "UTF-8"
			charSet = "UTF-8"
			memberLevel = JavadocMemberLevel.PACKAGE
			// Disable the crazy super-strict doclint tool in Java 8
			addStringOption("Xdoclint:none", "-quiet")

			tags(
				'apiNote:a:API Note:',
				'implSpec:a:Implementation Requirements:',
				'implNote:a:Implementation Note:'
			)
		}

		failOnError true

		include("**/api/**")
		source(project.sourceSets.main.allJava)
	}
}

// fill common elements of mod.json like authors, contact info, license
def fillModJson(project, task) {
	task.outputFile = project.file("src/main/resources/fabric.mod.json")

	task.json {
		version = "${project.version}"

		contactInformation = [
			"homepage": "${project.rootProject.mod_contact_homepage}",
			"issues": "${project.rootProject.mod_contact_issues}",
			"sources": "${project.rootProject.mod_contact_sources}"
		]

		author "OrnitheMC"

		licenses = [
			"${project.rootProject.mod_license}"
		]

		depends "fabricloader", "${project.rootProject.mod_loader_dependency}"
	}

	project.tasks.build.dependsOn task
}

def setUpLibrary(project) {
	def isCore = (project.path == ':libraries:core')

	project.apply plugin: 'java-library'
	project.apply plugin: 'eclipse'
	project.apply plugin: 'idea'

	project.base {
		archivesName = "${project.rootProject.mod_id_short}-${project.library_id}"
	}
	project.version = "${project.library_version}"
	project.group = "${project.rootProject.library_maven_group}"

	project.repositories {
		// needed for loader in subprojects without a mc dep
		// since in those subprojects loom is not applied
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Quilt'
			url = 'https://maven.quiltmc.org/repository/release'
		}
		mavenCentral()
	}

	def libraries = []
	def modules = []

	if (!isCore) {
		getLibraryDependencyNotations(project, libraries, modules)
	}

	project.dependencies {
		implementation "net.fabricmc:fabric-loader:${project.rootProject.loader_version}"

		implementation "org.apache.logging.log4j:log4j-api:2.19.0"
		implementation "org.apache.logging.log4j:log4j-core:2.19.0"

		implementation "org.quiltmc.parsers:json:${project.rootProject.quilt_parsers_version}"

		libraries.each { libraryPath ->
			evaluationDependsOn libraryPath
			implementation project.dependencies.project(path: libraryPath)
		}
		modules.each { modulePath ->
			evaluationDependsOn modulePath
			implementation project.dependencies.project(path: modulePath, configuration: 'namedElements')
		}
	}

	project.tasks.withType(GenerateModuleMetadata) {
		enabled = false
	}

	project.tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
		it.options.release = 8
	}

	project.java {
		// Still required by IDEs such as Eclipse and Visual Studio Code
		sourceCompatibility = JavaVersion.VERSION_1_8
		targetCompatibility = JavaVersion.VERSION_1_8
	}

	addPomDependency(project)
	setUpJavadoc(project)
}

def setUpModule(project) {
	def library = project.parent
	def isCore = (library.path == ':libraries:core')

	project.apply plugin: 'java-library'
	project.apply plugin: 'eclipse'
	project.apply plugin: 'idea'
	project.apply plugin: 'maven-publish'
	project.apply plugin: 'fabric-loom'
	project.apply plugin: 'ploceus'

	project.base {
		archivesName = "${project.rootProject.mod_id_short}-${library.library_id}"
	}
	project.version = "${library.library_version}+mc${project.min_mc_version}-mc${project.max_mc_version}"
	project.group = "${project.rootProject.library_maven_group}"

	def ctfile = project.file("src/main/resources/${project.rootProject.mod_id_short}.${library.library_id}.classtweaker")

	project.loom {
		if (project.hasProperty('environment') && project.environment == 'client') {
			clientOnlyMinecraftJar()
		}
		if (project.hasProperty('environment') && project.environment == 'server') {
			serverOnlyMinecraftJar()
		}

		if (ctfile.exists()) {
			accessWidenerPath = ctfile
		}
	}
	project.ploceus {
		setIntermediaryGeneration(2)
	}

	def libraries = []
	def modules = []

	if (!isCore) {
		getModuleDependencyNotations(project, libraries, modules)
	}

	project.dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		modImplementation "net.fabricmc:fabric-loader:${project.rootProject.loader_version}"

		if (project.hasProperty('raven_build')) {
			exceptions project.ploceus.raven(project.raven_build)
		}
		if (project.hasProperty('client_raven_build')) {
			clientExceptions project.ploceus.raven(project.client_raven_build, 'client')
		}
		if (project.hasProperty('server_raven_build')) {
			serverExceptions project.ploceus.raven(project.server_raven_build, 'server')
		}
		if (project.hasProperty('sparrow_build')) {
			signatures project.ploceus.sparrow(project.sparrow_build)
		}
		if (project.hasProperty('client_sparrow_build')) {
			clientSignatures project.ploceus.sparrow(project.client_sparrow_build, 'client')
		}
		if (project.hasProperty('server_sparrow_build')) {
			serverSignatures project.ploceus.sparrow(project.server_sparrow_build, 'server')
		}
		if (project.hasProperty('nests_build')) {
			nests project.ploceus.nests(project.nests_build)
		}
		if (project.hasProperty('client_nests_build')) {
			clientNests project.ploceus.nests(project.client_nests_build, 'client')
		}
		if (project.hasProperty('server_nests_build')) {
			serverNests project.ploceus.nests(project.server_nests_build, 'server')
		}

		if (project.hasProperty('feather_build')) {
			mappings project.ploceus.featherMappings(project.feather_build)
		} else {
			mappings project.ploceus.featherMappings(project.rootProject.feather_build)
		}

		implementation "org.quiltmc.parsers:json:${project.rootProject.quilt_parsers_version}"
		if (isCore) {
			include "org.quiltmc.parsers:json:${project.rootProject.quilt_parsers_version}"
		}

		implementation project.dependencies.project(path: library.path)

		libraries.each { libraryPath ->
			evaluationDependsOn libraryPath
			implementation project.dependencies.project(path: libraryPath)
		}
		modules.each { modulePath ->
			evaluationDependsOn modulePath
			implementation project.dependencies.project(path: modulePath, configuration: 'namedElements')
		}
	}

	project.rootProject.dependencies {
		include project.dependencies.project(path: project.path)
	}

	project.sourceSets {
		main {
			java {
				srcDirs += project.parent.sourceSets.main.java.srcDirs
			}
			resources {
				srcDirs += project.parent.sourceSets.main.resources.srcDirs
			}
		}
	}

	project.tasks.register('generateModJson', net.fabricmc.loom.task.FabricModJsonV1Task) {
		fillModJson(project, it)

		json {
			modId = "${project.rootProject.mod_id_short}-${library.library_id}"
			name = "${project.rootProject.mod_name_short} ${library.library_name}"
			description = "${library.library_description}"

			mixin "${project.rootProject.mod_id_short}.${library.library_id}.mixins.json"

			if (library.hasProperty('entrypoint_init')) {
				entrypoint 'init', library.entrypoint_init
			} else if (project.hasProperty('entrypoint_init')) {
				entrypoint 'init', project.entrypoint_init
			}
			if (library.hasProperty('entrypoint_client_init')) {
				entrypoint 'client-init', library.entrypoint_client_init
			} else if (project.hasProperty('entrypoint_client_init')) {
				entrypoint 'client-init', project.entrypoint_client_init
			}
			if (library.hasProperty('entrypoint_server_init')) {
				entrypoint 'server-init', library.entrypoint_server_init
			} else if (project.hasProperty('entrypoint_server_init')) {
				entrypoint 'server-init', project.entrypoint_server_init
			}

			if (ctfile.exists()) {
				accessWidener = ctfile.getName()
			}

			if (project.hasProperty('environment')) {
				environment = "${project.environment}"
			} else {
				environment = '*'
			}

			def minMcVersion = getMinecraftVersion(project.min_mc_version)
			def maxMcVersion = getMinecraftVersion(project.max_mc_version)

			depends "minecraft", ">=${minMcVersion} <=${maxMcVersion}"

			if (!isCore) {
				def deps = findDependencies(project)

				for (e : deps.entrySet()) {
					def library_id = e.key
					def library_version = e.value

					depends "${project.rootProject.mod_id_short}-${library_id}", ">=${library_version}"
				}
			}
		}
	}

	project.tasks.withType(GenerateModuleMetadata) {
		enabled = false
	}

	project.tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
		it.options.release = 8
	}

	project.java {
		// Still required by IDEs such as Eclipse and Visual Studio Code
		sourceCompatibility = JavaVersion.VERSION_1_8
		targetCompatibility = JavaVersion.VERSION_1_8

		// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task if it is present.
		// If you remove this line, sources will not be generated.
		withSourcesJar()

		// If this mod is going to be a library, then it should also generate Javadocs in order to aid with development.
		// Uncomment this line to generate them.
		withJavadocJar()
	}

	project.jar {
		from(project.rootProject.file('LICENSE')) {
			rename { "${it}_${project.base.archivesName.get()}" }
		}
	}

	project.publishing {
		publications {
			mavenJava(MavenPublication) {
				artifactId library.library_id
				from project.components.java

				pom.withXml {
					asNode().dependencies.dependency.each { dep ->
						if (dep.groupId.last().value().last() == project.group) {
							dep.parent().remove(dep)
						}
					}
				}
			}
		}
		repositories {
			def ENV = System.getenv()

			if (ENV.MAVEN_URL && shouldPublish(project, ENV.MAVEN_URL)) {
				maven {
					url ENV.MAVEN_URL

					credentials {
						username ENV.MAVEN_USERNAME
						password ENV.MAVEN_PASSWORD
					}
				}
			} else {
				mavenLocal()
			}
		}
	}

	setUpJavadoc(project)
}

def findDependencies(project) {
	def deps = new LinkedHashMap<>()
	findDependencies(project, deps)
	return deps
}

def findDependencies(project, libraries) {
	if (project.hasProperty('osl_dependencies')) {
		def deps = project.osl_dependencies.split(',')

		for (dep : deps) {
			def libraryName = dep.substring(0, dep.indexOf(':'))
			def libraryVersion = dep.substring(dep.indexOf(':') + 1)
			def libraryProject = project.project(":libraries:${libraryName}")

			findDependencies(libraryProject, libraries)

			libraries.compute(libraryName, (key, value) -> {
				def version = SemanticVersion.parse(libraryVersion)

				if (value == null || version > value) {
					return version
				} else {
					return value;
				}
			})
		}
	}
}

def getLibraryDependencyNotations(project, libraries, modules) {
	if (project.hasProperty('osl_dependencies')) {
		def deps = findDependencies(project)

		for (libraryName : deps.keySet()) {
			libraries.add(":libraries:${libraryName}")
		}
	}
}

def getModuleDependencyNotations(project, libraries, modules) {
	if (project.hasProperty('osl_dependencies')) {
		def deps = findDependencies(project)

		for (libraryName : deps.keySet()) {
			def moduleName = findModuleDependencyProject(project, libraryName)

			if (moduleName != null) {
				libraries.add(":libraries:${libraryName}")
				modules.add(":libraries:${libraryName}:${moduleName}")
			}
		}
	}
}

def findModuleDependencyProject(project, libraryName) {
	def library = project.project(":libraries:${libraryName}")
	def modules = library.getSubprojects()

	def projectMcVersion = getMinecraftVersion(project.minecraft_version)

	for (module : modules) {
		if (!environmentsMatch(project, module)) {
			continue;
		}

		def pathParts = module.path.split(':')
		def moduleName = pathParts[3]

		def mcVersionParts = moduleName.split('-mc')
		def minMcVersion = getMinecraftVersion(mcVersionParts[1])
		def maxMcVersion = getMinecraftVersion(mcVersionParts[2])

		if (projectMcVersion >= minMcVersion && projectMcVersion <= maxMcVersion) {
			return moduleName;
		}
	}

	return null
}

def getMinecraftVersion(name) {
	def release = McVersionLookup.getRelease(name)
	def normalized = McVersionLookup.normalizeVersion(name, release)

	return SemanticVersion.parse(normalized)
}

def environmentsMatch(project, module) {
	def env = project.hasProperty('environment') ? project.environment : '*'
	def menv = module.hasProperty('environment') ? module.environment : '*'

	return env == '*' || menv == '*' || env == menv
}

def shouldPublish(project, mavenUrl) {
	def groupId = project.publishing.publications.mavenJava.groupId
	def artifactId = project.publishing.publications.mavenJava.artifactId
	def version = project.publishing.publications.mavenJava.version

	def exists = false

	try {
		def xml = new URL("${mavenUrl}/${groupId.replace('.', '/')}/${artifactId}/maven-metadata.xml").text
		def metadata = new groovy.xml.XmlSlurper().parseText(xml)

		exists = metadata.versioning.versions.version.stream().filter({
			return it == version
		}).findFirst().isPresent()
	} catch (FileNotFoundException ignored) {
		// only happens if no publications exist yet
	}

	return !exists
}
